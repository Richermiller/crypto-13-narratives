name: 每6小时自动更新行情

on:
  schedule:
    # 北京时间 00:00 / 06:00 / 12:00 / 18:00  ←→  UTC 16:00 / 22:00 / 04:00 / 10:00
    # GitHub Actions 的 cron 采用 UTC；如需改成其它时区，只改下面这一行即可
    - cron: '0 16,22,4,10 * * *'
  workflow_dispatch: {}   # 允许在仓库页手动点「Run workflow」随时立即刷新

permissions:
  contents: write          # 允许把更新后的 data.json / index.html 提交回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 拉取日线OHLC并计算振幅拐点（日线数据，20小时内复用缓存）
        run: node amp.js

      - name: 拉取 CoinGecko 行情并重建页面
        run: node build.js

      - name: 提交并推送（数据有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json index.html amp.json
          if git diff --cached --quiet; then
            echo "行情数据无变化，跳过提交"
          else
            git commit -m "auto: 行情数据更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
