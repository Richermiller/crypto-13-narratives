<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETF 资金流向 · 全市场监控台</title>
<style>
:root{--bd:#dbe4ec;--ink:#17324d;--mut:#6b7c8d;--blu:#2c6fb0;--bg:#f2f5f9;--red:#c0392b;--grn:#1a7f45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
h1{font-size:21px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 18px;border:1px solid var(--bd);border-bottom:none;border-radius:9px 9px 0 0;background:#fff;color:var(--mut);cursor:pointer;font-weight:600;margin-bottom:-1px}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pane{display:none}.pane.on{display:block}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.cointabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ctab{padding:7px 16px;border:1px solid var(--bd);border-radius:20px;background:#fff;cursor:pointer;font-weight:600;color:var(--mut)}
.ctab.on{background:var(--blu);color:#fff;border-color:var(--blu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--mut);font-size:12px}
.kpi .v{font-size:22px;font-weight:700;margin-top:3px}
.pos{color:var(--red)}.neg{color:var(--grn)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}
th{background:#f7fafd;font-weight:700}td:first-child,th:first-child{text-align:left}
tr:hover td{background:#f6faff}
.scroll{max-height:520px;overflow:auto;border:1px solid var(--bd);border-radius:8px}
.mut{color:var(--mut)}
.bignum{font-size:30px;font-weight:700}
.hint{background:#fff8e6;border:1px solid #f0e0a8;border-radius:8px;padding:10px 14px;font-size:13px;color:#8a6d1a;margin-bottom:14px}
iframe{width:100%;height:85vh;border:1px solid var(--bd);border-radius:10px;background:#fff}
.badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:11px;background:#eef4fa;color:var(--blu)}
</style>
</head>
<body>
<div class="wrap">
<h1>ETF 资金流向 · 全市场监控台</h1>
<div class="sub">资金走向验证买卖力度｜数据源 CoinGlass（T+1 披露为准）｜GitHub Actions 定时自动更新，长期在线</div>

<div class="tabs">
  <div class="tab on" data-t="etf">① ETF 资金流向</div>
  <div class="tab" data-t="tool">② 采集工具（三级研判）</div>
  <div class="tab" data-t="narr">③ 叙事主线</div>
</div>

<!-- ============ ① ETF 资金流向 ============ -->
<div class="pane on" id="pane-etf">
  <div class="hint" id="etfHint">数据加载中…（若长时间为空，说明 CoinGlass API key 尚未配置，见 etf.js）</div>
  <div class="card">
    <div class="cointabs" id="coinTabs"></div>
    <div id="etfDetail"></div>
  </div>
  <div class="card">
    <h2 style="font-size:15px;margin:0 0 10px">重要市场指标（资金面 · 情绪面 · 杠杆面）</h2>
    <div class="kpis" id="mktKpis"></div>
    <div class="scroll" id="futTable" style="margin-top:12px"></div>
    <div class="mut" style="font-size:12px;margin-top:8px">恐惧贪婪 / 稳定币 / 资金费率 / OI / 24h 涨跌成交 —— 与 ETF 资金流共振时信号最强。</div>
  </div>
</div>

<!-- ============ ② 采集工具 ============ -->
<div class="pane" id="pane-tool"><iframe src="amp-tool-ours.html" loading="lazy"></iframe></div>

<!-- ============ ③ 叙事主线 ============ -->
<div class="pane" id="pane-narr"><iframe src="index.html" loading="lazy"></iframe></div>

</div>
<script>
'use strict';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=(v,d=2)=>v==null||isNaN(v)?'—':Number(v).toFixed(d);
const USD=v=>{v=Number(v);if(v==null||isNaN(v))return'—';const a=Math.abs(v);const s=a>=1e9?(a/1e9).toFixed(2)+'B':(a>=1e6?(a/1e6).toFixed(2)+'M':(a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0)));return(v<0?'-':'')+'$'+s;};
const USDM=v=>{v=Number(v);if(v==null||isNaN(v))return'—';const a=Math.abs(v);const s=a>=1000?'$'+(a/1000).toFixed(1)+'B':'$'+a.toFixed(0)+'M';return(v<0?'−':'+')+s;};

/* ============ 标签页切换 ============ */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  document.getElementById('pane-'+t.dataset.t).classList.add('on');
});

/* ============ 渲染 ETF 数据 ============ */
let ETF={}, curCoin=null;

async function loadEtf(){
  try{
    const r=await fetch('etf.json?t='+Date.now());
    if(r.ok){ ETF=await r.json(); }
  }catch(e){}
  try{
    const r=await fetch('etf_flow.json?t='+Date.now());
    if(r.ok){ const f=await r.json(); ETF.coins=f.coins||{}; ETF.flowSource=f.source; ETF.flowDate=f.updatedAt; }
  }catch(e){}
  renderEtf();
}
function renderEtf(){
  const hint=document.getElementById('etfHint');
  const coins=ETF.coins||{};
  const keys=Object.keys(coins);
  if(!keys.length){
    hint.innerHTML='⚠️ 暂无 ETF 数据：<b>etf.json 为空</b>。需配置 CoinGlass API key 后由 etf.js 定时抓取。骨架已就绪，等 key 到位即可自动填数据。';
    document.getElementById('coinTabs').innerHTML='';
    document.getElementById('etfDetail').innerHTML='';
    renderMkt(null,null);
    return;
  }
  hint.style.display='none';
  if(!curCoin || !coins[curCoin]) curCoin=keys[0];
  document.getElementById('coinTabs').innerHTML=keys.map(k=>
    `<span class="ctab ${k===curCoin?'on':''}" data-c="${k}">${k} ETF</span>`).join('');
  document.querySelectorAll('.ctab').forEach(el=>el.onclick=()=>{curCoin=el.dataset.c;renderEtf();});
  renderCoin(coins[curCoin]);
  renderMkt(ETF.mkt, ETF.futures);
}
function streakOf(series){
  if(!series||!series.length) return 0;
  let s=0; const sign=series[series.length-1]>=0?1:-1;
  for(let i=series.length-1;i>=0;i--){ if((series[i]>=0?1:-1)===sign) s+=sign; else break; }
  return s;
}
function renderCoin(c){
  const el=document.getElementById('etfDetail');
  const daily=c.daily; const cum=c.cum; const series=c.series||[]; const funds=c.funds||[];
  const dcls=daily>=0?'pos':'neg';
  const streak=streakOf(series);
  let h=`<div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">最新净流入（${c.date||'—'}）</div><div class="v ${dcls}">${USDM(daily)}</div></div>
    <div class="kpi"><div class="l">累计净流入</div><div class="v ${cum>=0?'pos':'neg'}">${USDM(cum)}</div></div>
    <div class="kpi"><div class="l">连续流入/流出</div><div class="v ${streak>=0?'pos':'neg'}">${streak>0?'+'+streak+' 天流入':streak<0?streak+' 天流出':'—'}</div></div>
    <div class="kpi"><div class="l">近${series.length}日累计</div><div class="v ${series.reduce((a,b)=>a+b,0)>=0?'pos':'neg'}">${USDM(series.reduce((a,b)=>a+b,0))}</div></div>
  </div>`;
  if(funds.length){
    h+=`<div class="scroll"><table><thead><tr><th>基金</th><th>发行商</th><th>当日净流入</th><th>累计净流入</th></tr></thead><tbody>`;
    for(const d of funds){
      const p=d.net>=0;
      h+=`<tr><td><b>${esc(d.ticker)}</b></td><td>${esc(d.name||'')}</td>
        <td class="${p?'pos':'neg'}">${USDM(d.net)}</td>
        <td class="${d.cum>=0?'pos':'neg'}">${USDM(d.cum)}</td></tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  if(series.length){
    h+=`<div class="mut" style="font-size:12px;margin-top:10px">近${series.length}日净流入(单位百万$)：`+series.map(v=>`<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v}</span>`).join(' → ')+`</div>`;
  }
  el.innerHTML=h;
}
function renderMkt(m, fut){
  const el=document.getElementById('mktKpis');
  let h='';
  if(m&&m.fgi!=null) h+=`<div class="kpi"><div class="l">恐惧贪婪指数</div><div class="v">${m.fgi}${m.fgi_label?' <span class="mut" style="font-size:12px">'+esc(m.fgi_label)+'</span>':''}</div></div>`;
  if(m&&m.stable!=null) h+=`<div class="kpi"><div class="l">稳定币市值(USDT+USDC)</div><div class="v">${USD(m.stable)}</div></div>`;
  el.innerHTML=h||'<div class="kpi"><div class="l">市场指标</div><div class="v mut">待配置</div></div>';
  const fe=document.getElementById('futTable');
  const coins=fut?Object.keys(fut):[];
  if(!coins.length){ fe.innerHTML='<div class="mut" style="padding:8px">暂无期货资金面数据</div>'; return; }
  let t='<table><thead><tr><th>币种</th><th>资金费率</th><th>未平仓 OI</th><th>24h 涨跌</th><th>24h 成交额</th></tr></thead><tbody>';
  for(const c of coins){
    const r=fut[c]||{};
    const fr=r.funding!=null?r.funding*100:null;
    const chg=r.chg24h;
    t+=`<tr><td><b>${esc(c)}</b></td>
      <td class="${fr!=null&&fr>=0?'pos':'neg'}">${fr==null?'—':fr.toFixed(4)+'%'}</td>
      <td>${r.oi==null?'—':USD(r.oi)+' '+esc(c)}</td>
      <td class="${chg!=null&&chg>=0?'pos':'neg'}">${chg==null?'—':(chg>=0?'+':'')+chg.toFixed(2)+'%'}</td>
      <td>${r.vol24h==null?'—':USD(r.vol24h)}</td></tr>`;
  }
  t+='</tbody></table>';
  fe.innerHTML=t;
}
loadEtf();
</script>
</body>
</html>
